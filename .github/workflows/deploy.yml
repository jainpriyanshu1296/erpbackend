name: Deploy ERP Backend

on:
  push:
    branches:
      - main

concurrency:
  group: erpbackend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Deploy ERP Backend
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          export MASTER_DB_NAME="masterERP"

          cd /Users/priyanshujain/erpbackend

          echo "==> Fetching latest code"
          /usr/bin/git fetch origin main

          echo "==> Syncing production code"
          /usr/bin/git reset --hard origin/main

          echo "==> Installing dependencies"
          /opt/homebrew/bin/npm ci

          echo "==> Checking backend"
          /opt/homebrew/bin/npm run check

          echo "==> Applying master database migrations"
          /opt/homebrew/bin/npm run migrate:master

          echo "==> Applying active organization database migrations"
          /opt/homebrew/bin/npm run migrate:org -- --all

          echo "==> Restarting ERP backend"
          /opt/homebrew/bin/pm2 restart erp-backend --update-env

          echo "==> Deployment completed"
          /opt/homebrew/bin/pm2 status erp-backend
